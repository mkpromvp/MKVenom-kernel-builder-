name: "Spinel GKI Builder (KernelSU-Next + SUSFS + AnyKernel3)"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      anykernel_repo:
        description: "AnyKernel3 repo"
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"
        type: string
      anykernel_branch:
        description: "AnyKernel3 branch"
        required: true
        default: "master"
        type: string
      kernel_name:
        description: "Kernel display name in zip"
        required: true
        default: "MKVenom-GKI-KSU-SUSFS"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 python3 python-is-python3 \
            zip unzip cpio pahole pkg-config rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld
          echo "Dependencies installed"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 \
            --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_source_url }}" kernel_src

          cd kernel_src
          test -f arch/arm64/configs/gki_defconfig || {
            echo "::error::gki_defconfig not found in this branch"
            exit 1
          }

      - name: Setup KernelSU-Next (latest tag)
        run: |
          set -e
          cd kernel_src
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash
          echo "KernelSU-Next setup done"

      - name: Setup SUSFS (latest)
        run: |
          set -e
          cd kernel_src

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu 2>/dev/null || \
          git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu

          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          cp -f ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ || true
          cp -f ../susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/ || true

          PATCHED=0

          # Apply newest matching patch first
          for p in $(ls -1 ../susfs4ksu/kernel_patches/add_susfs_in_kernel-*.patch 2>/dev/null | sort -V -r); do
            if patch -p1 --forward --dry-run < "$p" >/dev/null 2>&1; then
              patch -p1 --forward < "$p"
              echo "Applied: $(basename "$p")"
              PATCHED=1
              break
            fi
          done

          # Fallback patches
          if [ "$PATCHED" -eq 0 ]; then
            for p in \
              ../susfs4ksu/kernel_patches/50_add_susfs_in_fs.patch \
              ../susfs4ksu/kernel_patches/60_add_susfs_in_kernel.patch
            do
              [ -f "$p" ] || continue
              if patch -p1 --forward --dry-run < "$p" >/dev/null 2>&1; then
                patch -p1 --forward < "$p"
                echo "Applied fallback: $(basename "$p")"
                PATCHED=1
                break
              fi
            done
          fi

          [ "$PATCHED" -eq 1 ] || echo "::warning::No SUSFS patch applied cleanly"

      - name: Build GKI kernel
        run: |
          set -e
          cd kernel_src

          MAKE_FLAGS="
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
          "

          make $MAKE_FLAGS mrproper
          mkdir -p out

          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_DEBUG=n' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
            'CONFIG_KSU_SUSFS_SPOOFER=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            'CONFIG_CPQ_IOSCHED=n' \
            > /tmp/ksu_susfs.config

          make $MAKE_FLAGS gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/ksu_susfs.config
          make $MAKE_FLAGS olddefconfig
          make $MAKE_FLAGS -j"$(nproc)"

          test -f out/arch/arm64/boot/Image || {
            echo "::error::Image not found"
            exit 1
          }

      - name: Pack AnyKernel3 zip
        run: |
          set -e
          git clone --depth=1 \
            --branch "${{ inputs.anykernel_branch }}" \
            "${{ inputs.anykernel_repo }}" AnyKernel3

          cp -f kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image

          # Simple rename in anykernel banner if variable exists
          sed -i "s/^kernel.string=.*/kernel.string=${{ inputs.kernel_name }}/" AnyKernel3/anykernel.sh || true

          DATE="$(date +%Y%m%d-%H%M)"
          ZIP_NAME="${{ inputs.kernel_name }}-${DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..

          mkdir -p artifacts
          mv -f "${ZIP_NAME}" artifacts/
          cp -f kernel_src/out/.config artifacts/gki.config
          cp -f kernel_src/out/vmlinux artifacts/vmlinux || true
          cp -f kernel_src/out/arch/arm64/boot/Image artifacts/Image

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spinel-gki-ksu-susfs-anykernel
          path: artifacts/*
