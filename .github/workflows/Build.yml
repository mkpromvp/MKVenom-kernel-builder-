name: "Spinel GKI Builder - KSU + SUSFS + AnyKernel"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      kernel_name:
        description: "Kernel name"
        required: true
        default: "MKVenom-GKI-KSU-SUSFS"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 python3 python-is-python3 \
            zip unzip cpio pahole pkg-config rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source_url }}" kernel_src
          cd kernel_src
          test -f arch/arm64/configs/gki_defconfig || { echo "::error::gki_defconfig not found"; exit 1; }

      - name: Setup KernelSU-Next
        run: |
          set -e
          cd kernel_src
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash

      - name: Setup SUSFS
        run: |
          set -e
          cd kernel_src

          export GIT_TERMINAL_PROMPT=0
          rm -rf ../susfs4ksu

          SUSFS_REF=""
          for ref in gki-android14-5.10 gki-android13-5.10 gki-android12-5.10 kernel-5.10 main master; do
            if (git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git "$ref" 2>/dev/null ||                 git ls-remote --heads https://github.com/simonpunk/susfs4ksu.git "$ref" 2>/dev/null) | grep -q .; then
              SUSFS_REF="$ref"
              break
            fi
          done
          [ -n "$SUSFS_REF" ] || SUSFS_REF="main"
          echo "Using SUSFS ref: $SUSFS_REF"

          git clone --depth=1 --branch "$SUSFS_REF" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu 2>/dev/null ||           git clone --depth=1 --branch "$SUSFS_REF" https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu || {
            echo "::error::Failed to clone susfs4ksu"
            exit 1
          }

          KSU_DIR=""
          for d in KernelSU-Next KernelSU; do
            [ -d "$d/kernel" ] && KSU_DIR="$d" && break
          done
          [ -n "$KSU_DIR" ] || { echo "::error::KernelSU dir not found"; exit 1; }

          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          cp -f ../susfs4ksu/kernel_patches/include/linux/* include/linux/ || true

          # optional: this patch may fail on some KernelSU-Next tags, so don't kill build
          if [ -f ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ]; then
            patch -d "$KSU_DIR" -p1 --forward --batch < ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ||             echo "::warning::KernelSU SUSFS patch not clean on this KSU tag, continuing"
          fi

          PATCHED=0
          for p in             ../susfs4ksu/kernel_patches/add_susfs_in_kernel-*.patch             ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel.patch             ../susfs4ksu/kernel_patches/60_add_susfs_in_kernel.patch             ../susfs4ksu/kernel_patches/50_add_susfs_in_fs.patch
          do
            [ -f "$p" ] || continue
            if patch -p1 --forward --batch --dry-run < "$p" >/dev/null 2>&1; then
              patch -p1 --forward --batch < "$p"
              echo "Applied SUSFS patch: $(basename "$p")"
              PATCHED=1
              break
            fi
          done

          [ "$PATCHED" -eq 1 ] || {
            echo "::error::No SUSFS patch applied cleanly"
            ls -lah ../susfs4ksu/kernel_patches || true
            exit 1
          }

          test -f include/linux/susfs.h || echo "::warning::susfs.h not found after patch"

      - name: Build GKI
        run: |
          set -e
          cd kernel_src

          MAKE_FLAGS="
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
          "

          make $MAKE_FLAGS mrproper
          mkdir -p out

          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_DEBUG=n' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
            'CONFIG_KSU_SUSFS_SPOOFER=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            > /tmp/ksu_susfs.config

          make $MAKE_FLAGS gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/ksu_susfs.config
          make $MAKE_FLAGS olddefconfig
          make $MAKE_FLAGS -j"$(nproc)"

          test -f out/arch/arm64/boot/Image || { echo "::error::Image not found"; exit 1; }

      - name: Pack AnyKernel3
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp -f kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image
          sed -i "s/^kernel.string=.*/kernel.string=${{ inputs.kernel_name }}/" AnyKernel3/anykernel.sh || true

          DATE="$(date +%Y%m%d-%H%M)"
          ZIP_NAME="${{ inputs.kernel_name }}-${DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..

          mkdir -p artifacts
          mv -f "${ZIP_NAME}" artifacts/
          cp -f kernel_src/out/arch/arm64/boot/Image artifacts/Image
          cp -f kernel_src/out/.config artifacts/gki.config

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-ksu-susfs-anykernel
          path: artifacts/*
