name: "Spinel Kernel Builder - KSU + SUSFS (ACK)"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      root_manager:
        description: "Root manager (all include SUSFS)"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "ReSukiSU"
          - "WildKernels-Patch"
      upload_gofile:
        description: "Upload outputs to GoFile"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 python3 python-is-python3 \
            zip unzip cpio pahole pkg-config rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld 2>&1 | tail -5
          echo "✓ Dependencies installed"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 \
            --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_source_url }}" \
            kernel_src
          echo "KERNEL_DIR=$PWD/kernel_src" >> "$GITHUB_ENV"

          cd kernel_src
          VER=$(make kernelversion 2>/dev/null | head -1 || echo "unknown")
          echo "KERNEL_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Kernel version: $VER"

          # اكتشف الـ defconfig الصح للجهاز الحقيقي
          # بنبعد عن: fpga, kasan, khwasan, rockpi, db845c, hikey
          echo "=== Available defconfigs ==="
          find arch/arm64/configs -name "*defconfig" | sort
          echo "==========================="

          DEFCFG=$(find arch/arm64/configs -name "*defconfig" \
            | grep -ivE 'fpga|kasan|khwasan|rockpi|db845c|hikey|gki_defconfig' \
            | grep -iE 'mgk_64_k510|mgk_64|k6789|mt6789|spinel|user' \
            | head -1 || true)

          # لو ما لقيناش نبحث عن أي mgk_64 بدون fpga
          if [ -z "$DEFCFG" ]; then
            DEFCFG=$(find arch/arm64/configs -name "mgk_64*defconfig" \
              | grep -ivE 'fpga|kasan|khwasan' | head -1 || true)
          fi

          # آخر fallback
          if [ -z "$DEFCFG" ]; then
            DEFCFG=$(find arch/arm64/configs -name "*defconfig" \
              | grep -ivE 'fpga|kasan|khwasan|rockpi|db845c|hikey' \
              | head -1 || true)
          fi

          [ -n "$DEFCFG" ] || { echo "::error::No suitable defconfig found!"; exit 1; }
          DEFCFG_NAME=$(basename "$DEFCFG")
          echo "DEFCFG_NAME=$DEFCFG_NAME" >> "$GITHUB_ENV"
          echo "✓ Selected defconfig: $DEFCFG_NAME"

      - name: Clone MTK kernel modules
        run: |
          BRANCH="${{ inputs.kernel_branch }}"
          git clone --depth=1 \
            --branch "$BRANCH" \
            "https://github.com/MiCode/MTK_kernel_modules.git" \
            kernel_src/vendor_modules 2>/dev/null \
          && echo "✓ MTK modules cloned" \
          || echo "::warning::MTK modules not found, continuing"

      # ─────────────────────────────────────────────────────────────────
      # KSU + SUSFS — بنعمل setup قبل build.sh
      # ─────────────────────────────────────────────────────────────────
      - name: Setup KSU + SUSFS (${{ inputs.root_manager }})
        run: |
          set -e
          cd "$KERNEL_DIR"

          setup_susfs() {
            echo "→ Adding SUSFS patches..."
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git \
              ../susfs4ksu 2>/dev/null || \
            git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git \
              ../susfs4ksu

            cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/susfs.h \
               include/linux/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/sus_su.h \
               include/linux/ 2>/dev/null || true

            for P in \
              "../susfs4ksu/kernel_patches/add_susfs_in_kernel-"*.patch \
              "../susfs4ksu/kernel_patches/50_add_susfs_in_fs.patch" \
              "../susfs4ksu/kernel_patches/60_add_susfs_in_kernel.patch"; do
              [ -f "$P" ] && \
                patch -p1 --forward < "$P" 2>/dev/null && \
                echo "✓ Applied SUSFS: $(basename $P)" && break || true
            done
          }

          case "${{ inputs.root_manager }}" in
            KernelSU-Next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                | bash -s next || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                | bash
              setup_susfs
              echo "MGR_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR_NAME=KernelSU-Next_Manager"        >> "$GITHUB_ENV"
              ;;
            SukiSU-Ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
                | bash -s susfs-main
              echo "MGR_REPO=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_ENV"
              echo "MGR_NAME=SukiSU_Manager"             >> "$GITHUB_ENV"
              ;;
            ReSukiSU)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" \
                | bash
              find fs/ include/ -name "susfs*" 2>/dev/null | grep -q . || setup_susfs
              echo "MGR_REPO=ReSukiSU/ReSukiSU" >> "$GITHUB_ENV"
              echo "MGR_NAME=ReSukiSU_Manager"   >> "$GITHUB_ENV"
              ;;
            WildKernels-Patch)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                | bash -s next || \
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
                | bash
              setup_susfs
              echo "MGR_REPO=WildKernels/Wild_KSU" >> "$GITHUB_ENV"
              echo "MGR_NAME=WildKSU_Manager"       >> "$GITHUB_ENV"
              ;;
          esac
          echo "✓ KSU + SUSFS done"

      # ─────────────────────────────────────────────────────────────────
      # Build — make مباشرة مع mrproper أولاً
      # بنتجنب build.sh لأنه بيطلب clean source tree
      # ─────────────────────────────────────────────────────────────────
      - name: Build kernel
        run: |
          set -e
          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          MAKE_FLAGS="
            ARCH=arm64
            CC=clang
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
            O=out
          "

          # mrproper عشان ينظف أي حاجة من الـ KSU setup
          echo "→ Running mrproper..."
          make $MAKE_FLAGS mrproper 2>/dev/null || true

          mkdir -p out

          # KSU + SUSFS config fragment
          cat > /tmp/ksu_susfs.config << 'KCFG'
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOFER=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          KCFG

          # load defconfig
          echo "→ Loading defconfig: $DEFCFG_NAME"
          make $MAKE_FLAGS "$DEFCFG_NAME" 2>&1 | tail -5

          # دمج KSU + SUSFS configs
          echo "→ Merging KSU+SUSFS config fragment..."
          ./scripts/kconfig/merge_config.sh \
            -m -O out \
            out/.config \
            /tmp/ksu_susfs.config 2>&1 | tail -5
          make $MAKE_FLAGS olddefconfig 2>&1 | tail -3

          # Build!
          echo "→ Building kernel ($(nproc) cores)..."
          make $MAKE_FLAGS -j$(nproc) 2>&1 | tail -60

          # ابحث عن الـ Image
          IMAGE=$(find out/arch/arm64/boot -name "Image" -o -name "Image.gz" \
            2>/dev/null | grep -v "\.ko" | head -1 || true)
          [ -n "$IMAGE" ] && [ -s "$IMAGE" ] || \
            { echo "::error::Kernel Image not found!"; exit 1; }

          echo "IMAGE_PATH=$IMAGE" >> "$GITHUB_ENV"
          echo "✓ Kernel: $IMAGE ($(du -sh $IMAGE | cut -f1))"

      - name: Verify KSU + SUSFS in kernel
        run: |
          IMAGE="${{ env.IMAGE_PATH }}"
          SUSFS="no"; KSU="no"
          strings "$IMAGE" | grep -Eiq 'susfs|sus_su|ksu_susfs' && SUSFS="yes"
          strings "$IMAGE" | grep -Eiq 'kernelsu|KernelSU'      && KSU="yes"
          echo "SUSFS_IN_KERNEL=$SUSFS" >> "$GITHUB_ENV"
          echo "KSU_IN_KERNEL=$KSU"     >> "$GITHUB_ENV"
          echo "KSU: $KSU | SUSFS: $SUSFS"

      - name: Setup magiskboot
        run: |
          curl -sL "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" \
            -o magisk.apk
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot && chmod +x magiskboot

      - name: Build AnyKernel3
        run: |
          set -e
          mkdir -p out_artifacts
          cp "${{ env.IMAGE_PATH }}" out_artifacts/Image

          curl -fL "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -o ak3.zip
          unzip -q ak3.zip
          AK3="AnyKernel3-master"
          cp out_artifacts/Image "$AK3/Image"

          perl -0777 -i -pe '
            s/^block=.*/block=boot/m;
            s/^is_slot_device=.*/is_slot_device=auto/m;
            s/^do\.devicecheck=.*/do.devicecheck=0/m;
            s/^do\.modules=.*/do.modules=0/m;
            s/^kernel\.string=.*/kernel.string=Spinel KSU+SUSFS [${{ inputs.root_manager }}] by CI/m;
          ' "$AK3/anykernel.sh"

          grep -q '^block='         "$AK3/anykernel.sh" || echo 'block=boot'          >> "$AK3/anykernel.sh"
          grep -q '^is_slot_device' "$AK3/anykernel.sh" || echo 'is_slot_device=auto' >> "$AK3/anykernel.sh"

          (cd "$AK3" && zip -r9 ../out_artifacts/Flashable_AnyKernel3.zip . -x ".git/*")
          echo "✓ AnyKernel3: $(du -sh out_artifacts/Flashable_AnyKernel3.zip | cut -f1)"

      - name: Download Manager APK
        run: |
          set -e
          mkdir -p out_artifacts/managers

          if [ "${{ inputs.root_manager }}" = "ReSukiSU" ]; then
            for ARTIFACT in Manager-release Manager-spoofed; do
              LABEL=$(echo "$ARTIFACT" | sed 's/Manager-//')
              HTTP=$(curl -sL --write-out "%{http_code}" \
                "https://nightly.link/ReSukiSU/ReSukiSU/workflows/build-manager/main/${ARTIFACT}.zip" \
                -o /tmp/${ARTIFACT}.zip)
              if [ "$HTTP" = "200" ] && [ -s /tmp/${ARTIFACT}.zip ]; then
                unzip -q /tmp/${ARTIFACT}.zip -d /tmp/${ARTIFACT}/
                APK=$(find /tmp/${ARTIFACT}/ -name "*.apk" | head -1 || true)
                [ -n "$APK" ] && \
                  cp "$APK" "out_artifacts/managers/ReSukiSU_${LABEL}.apk" && \
                  echo "✓ ReSukiSU ${LABEL} APK"
              fi
            done
          else
            URL=$(curl -s "https://api.github.com/repos/${{ env.MGR_REPO }}/releases/latest" \
              | jq -r '.assets[] | select(.name|endswith(".apk")) | .browser_download_url' \
              | head -1 || true)
            [ -n "$URL" ] && [ "$URL" != "null" ] && \
              curl -sL "$URL" -o "out_artifacts/managers/${{ env.MGR_NAME }}.apk" && \
              echo "✓ Manager: ${{ env.MGR_NAME }}" || \
              echo "::warning::Manager APK not found"
          fi

      - name: Download SUSFS module
        run: |
          mkdir -p out_artifacts/modules
          URL=$(curl -s https://api.github.com/repos/sidex15/ksu_module_susfs/releases/latest \
            | jq -r '.assets[] | select(.name|endswith(".zip")) | .browser_download_url' \
            | head -1 || true)
          [ -z "$URL" ] || [ "$URL" = "null" ] && \
            URL="https://github.com/sidex15/ksu_module_susfs/releases/download/v1.5.1/ksu_module_susfs_v1.5.1.zip"
          curl -sL "$URL" -o out_artifacts/modules/ksu_module_susfs.zip
          echo "✓ SUSFS module ready"

      - name: Generate build report
        run: |
          {
            echo "Spinel Kernel Build Report"
            echo "=========================="
            echo "Date        : $(date -u)"
            echo "Source      : ${{ inputs.kernel_source_url }}"
            echo "Branch      : ${{ inputs.kernel_branch }}"
            echo "Defconfig   : ${{ env.DEFCFG_NAME }}"
            echo "Manager     : ${{ inputs.root_manager }}"
            echo "Kernel ver  : ${{ env.KERNEL_VERSION }}"
            echo "KSU found   : ${{ env.KSU_IN_KERNEL }}"
            echo "SUSFS found : ${{ env.SUSFS_IN_KERNEL }}"
          } | tee out_artifacts/build_report.txt
          echo "=== out_artifacts ==="
          ls -lh out_artifacts/ out_artifacts/managers/ out_artifacts/modules/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Spinel [${{ inputs.root_manager }}] [${{ env.KERNEL_VERSION }}]"
          path: out_artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload to GoFile
        if: ${{ inputs.upload_gofile }}
        run: |
          set +e
          upload_gofile() {
            local FILE="$1" LABEL="$2"
            [ -f "$FILE" ] || return
            SERVER=$(curl -sf https://api.gofile.io/servers | jq -r '.data.servers[0].name')
            [ -n "$SERVER" ] && [ "$SERVER" != "null" ] || return
            LINK=$(curl -# -F "file=@${FILE}" "https://${SERVER}.gofile.io/uploadFile" \
              | jq -r '.data.downloadPage')
            [ -n "$LINK" ] && [ "$LINK" != "null" ] && \
              echo "GOFILE_${LABEL}=${LINK}" >> "$GITHUB_ENV" && \
              echo "GoFile ${LABEL}: ${LINK}"
          }
          upload_gofile "out_artifacts/Flashable_AnyKernel3.zip" "ANYKERNEL3"
          upload_gofile "out_artifacts/Image"                     "IMAGE"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Spinel Kernel Build"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Branch | \`${{ inputs.kernel_branch }}\` |"
            echo "| Defconfig | \`${{ env.DEFCFG_NAME }}\` |"
            echo "| Manager | \`${{ inputs.root_manager }}\` |"
            echo "| Kernel Version | \`${{ env.KERNEL_VERSION }}\` |"
            echo "| KSU in kernel | \`${{ env.KSU_IN_KERNEL }}\` |"
            echo "| SUSFS in kernel | \`${{ env.SUSFS_IN_KERNEL }}\` |"
            echo "| GoFile AnyKernel3 | ${{ env.GOFILE_ANYKERNEL3 }} |"
            echo "| GoFile Image | ${{ env.GOFILE_IMAGE }} |"
          } >> "$GITHUB_STEP_SUMMARY"
