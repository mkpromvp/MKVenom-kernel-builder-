name: "Spinel Kernel Builder - KSU + SUSFS (GKI)"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      root_manager:
        description: "Root manager (all include SUSFS)"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "ReSukiSU"
          - "WildKernels-Patch"
      upload_gofile:
        description: "Upload outputs to GoFile"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 python3 python-is-python3 \
            zip unzip cpio pahole pkg-config rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld llvm-dev libclang-dev
          echo "✓ Dependencies installed"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      # ==================== Clone Kernel ====================
      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_source_url }}" kernel_src
          
          echo "KERNEL_DIR=$PWD/kernel_src" >> "$GITHUB_ENV"
          cd kernel_src

          # Detect kernel version
          VER=$(make kernelversion 2>/dev/null || echo "unknown")
          echo "KERNEL_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "Kernel version: $VER"

          echo "BUILD_TYPE=GKI" >> "$GITHUB_ENV"
          echo "✓ GKI/ACK Kernel detected"

      # ==================== Setup KSU + SUSFS ====================
      - name: Setup KSU + SUSFS (${{ inputs.root_manager }})
        run: |
          cd "$KERNEL_DIR"
          
          setup_susfs() {
            echo "→ Adding SUSFS patches..."
            git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu
            cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/ 2>/dev/null || true
            
            for p in ../susfs4ksu/kernel_patches/*.patch; do
              [ -f "$p" ] && patch -p1 --forward < "$p" 2>/dev/null && echo "✓ Applied $(basename $p)"
            done
          }

          case "${{ inputs.root_manager }}" in
            KernelSU-Next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              setup_susfs
              ;;
            SukiSU-Ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
              ;;
            ReSukiSU)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              setup_susfs
              ;;
            WildKernels-Patch)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              setup_susfs
              ;;
          esac

      # ==================== Add KSU+SUSFS Config ====================
      - name: Add KSU + SUSFS config
        run: |
          cd "$KERNEL_DIR"
          
          cat > arch/arm64/configs/ksu_susfs.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOFER=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF

          # Add to build.config.gki.aarch64 if exists
          if [ -f build.config.gki.aarch64 ]; then
            echo 'POST_DEFCONFIG_CMDS="${POST_DEFCONFIG_CMDS} merge_config.sh -m .config arch/arm64/configs/ksu_susfs.config"' \
              >> build.config.gki.aarch64
            echo "✓ Added KSU+SUSFS to build.config.gki.aarch64"
          fi

      # ==================== Build GKI Kernel ====================
      - name: Build GKI Kernel
        run: |
          cd "$KERNEL_DIR"
          mkdir -p out dist

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          if [ -f build/build.sh ]; then
            echo "→ Building with official GKI build script..."
            export BUILD_CONFIG=${BUILD_CONFIG:-build.config.gki.aarch64}
            export OUT_DIR=$PWD/out
            export DIST_DIR=$PWD/dist
            export SKIP_MRPROPER=1
            export BUILD_KERNEL=1

            bash build/build.sh 2>&1 | tee build.log
          else
            echo "→ Fallback GKI build..."
            make O=out gki_defconfig
            ./scripts/kconfig/merge_config.sh -m out/.config arch/arm64/configs/ksu_susfs.config
            make O=out -j$(nproc) 2>&1 | tail -100
          fi

          # Find kernel image
          IMAGE=$(find out/arch/arm64/boot -name "Image" -o -name "Image.gz" | head -n1)
          [ -z "\( IMAGE" ] && IMAGE= \)(find out -name "Image" | head -n1)
          
          if [ -n "$IMAGE" ] && [ -s "$IMAGE" ]; then
            echo "IMAGE_PATH=$IMAGE" >> "$GITHUB_ENV"
            echo "✓ Kernel built successfully: $(du -sh $IMAGE | cut -f1)"
          else
            echo "::error::Kernel Image not found!"
            exit 1
          fi

      # ==================== Verify & Rest of steps ====================
      - name: Verify KSU + SUSFS
        run: |
          IMAGE="${{ env.IMAGE_PATH }}"
          strings "$IMAGE" | grep -Eiq 'kernelsu|KernelSU' && echo "KSU_IN_KERNEL=yes" >> "$GITHUB_ENV" || echo "KSU_IN_KERNEL=no" >> "$GITHUB_ENV"
          strings "$IMAGE" | grep -Eiq 'susfs|sus_su' && echo "SUSFS_IN_KERNEL=yes" >> "$GITHUB_ENV" || echo "SUSFS_IN_KERNEL=no" >> "$GITHUB_ENV"

      # (باقي الـ steps زي ما هي: magiskboot, AnyKernel3, Manager APK, SUSFS module, upload ...)

      - name: Setup magiskboot
        run: |
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -o magisk.apk
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot && chmod +x magiskboot

      - name: Build AnyKernel3
        run: |
          mkdir -p out_artifacts
          cp "${{ env.IMAGE_PATH }}" out_artifacts/Image
          
          curl -fL https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -o ak3.zip
          unzip -q ak3.zip
          cd AnyKernel3-master
          
          sed -i 's/^block=.*/block=boot/' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' anykernel.sh
          sed -i 's/^do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^kernel\.string=.*/kernel.string=Spinel GKI KSU+SUSFS [${{ inputs.root_manager }}]/' anykernel.sh
          
          zip -r9 ../out_artifacts/Flashable_AnyKernel3.zip . -x ".git/*"

      # ... (باقي الـ steps: Manager APK + SUSFS Module + Upload)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: "Spinel-GKI [\( {{ inputs.root_manager }}] [ \){{ env.KERNEL_VERSION }}]"
          path: out_artifacts/
          retention-days: 7
