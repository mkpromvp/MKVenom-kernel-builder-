name: "Spinel GKI Builder - KSU + SUSFS + AnyKernel"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      kernel_name:
        description: "Kernel name"
        required: true
        default: "MKVenom-GKI-KSU-SUSFS"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install deps (smart + safe)
        run: |
          set -e
          sudo apt-get update -qq

          # Minimal required for this workflow
          REQUIRED_PKGS=(
            bc bison flex git curl
            build-essential
            libssl-dev libelf-dev
            clang llvm lld
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
            lz4 python3 zip unzip cpio rsync pahole
          )

          MISSING=()
          for pkg in "${REQUIRED_PKGS[@]}"; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING+=("$pkg")
          done

          if [ "${#MISSING[@]}" -eq 0 ]; then
            echo "All required packages already installed."
            exit 0
          fi

          echo "Missing packages: ${MISSING[*]}"
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${MISSING[@]}" >/tmp/apt-install.log 2>&1; then
            echo "Smart install failed, retrying with safe fallback..."
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends               bc bison flex git curl build-essential               libssl-dev libelf-dev clang llvm lld               gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu               lz4 python3 zip unzip cpio rsync pahole >/tmp/apt-install.log 2>&1
          fi

          echo "Deps install done."
          tail -n 40 /tmp/apt-install.log || true

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source_url }}" kernel_src
          cd kernel_src
          test -f arch/arm64/configs/gki_defconfig || { echo "::error::gki_defconfig not found"; exit 1; }

      - name: Setup KernelSU-Next + SUSFS (strict compatible)
        run: |
          set -e
          cd kernel_src
          export GIT_TERMINAL_PROMPT=0

          # Setup KSUN (initial)
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash

          # Clone SUSFS fixed branch for 5.10 GKI
          rm -rf ../susfs4ksu
          git clone --depth=1 --branch gki-android13-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu 2>/dev/null || \
          git clone --depth=1 --branch gki-android13-5.10 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu

          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          cp -f ../susfs4ksu/kernel_patches/include/linux/* include/linux/ || true

          KSU_DIR="KernelSU-Next"
          [ -d "$KSU_DIR/kernel" ] || { echo "::error::KernelSU-Next dir not found"; exit 1; }

          KSU_PATCH="../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"

          # Find compatible KSUN tag if current one is not compatible
          if [ -f "$KSU_PATCH" ]; then
            if ! patch -d "$KSU_DIR" -p1 --forward --batch --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
              echo "Current KSUN tag not compatible, searching..."
              FOUND=0
              for t in $(git -C "$KSU_DIR" tag --sort=-v:refname); do
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$t" >/dev/null 2>&1 || true
                if patch -d "$KSU_DIR" -p1 --forward --batch --dry-run < "$KSU_PATCH" >/dev/null 2>&1; then
                  echo "Using KSUN tag: $t"
                  patch -d "$KSU_DIR" -p1 --forward --batch < "$KSU_PATCH"
                  FOUND=1
                  break
                fi
              done
              [ "$FOUND" -eq 1 ] || { echo "::error::No compatible KSUN tag found for SUSFS patch"; exit 1; }
            else
              patch -d "$KSU_DIR" -p1 --forward --batch < "$KSU_PATCH"
            fi
          fi

          # Apply SUSFS kernel patch (strict)
          PATCHED=0
          for p in \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_*.patch \
            ../susfs4ksu/kernel_patches/add_susfs_in_kernel-*.patch
          do
            [ -f "$p" ] || continue
            if patch -p1 --forward --batch --dry-run < "$p" >/dev/null 2>&1; then
              patch -p1 --forward --batch < "$p"
              echo "Applied SUSFS patch: $(basename "$p")"
              PATCHED=1
              break
            fi
          done
          [ "$PATCHED" -eq 1 ] || { echo "::error::No SUSFS kernel patch applied cleanly"; exit 1; }

      - name: Build GKI
        run: |
          set -e
          cd kernel_src

          MAKE_FLAGS="
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
          "

          make $MAKE_FLAGS mrproper
          mkdir -p out

          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_DEBUG=n' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
            'CONFIG_KSU_SUSFS_SPOOFER=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_SUS_SU=n' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            > /tmp/ksu_susfs.config

          make $MAKE_FLAGS gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/ksu_susfs.config
          make $MAKE_FLAGS olddefconfig
          set +e
          make $MAKE_FLAGS -j"$(nproc)" 2>&1 | tee /tmp/kernel-build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "BUILD_RC=$BUILD_RC" | tee /tmp/build-result.log
          set -e
          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"

          test -f out/arch/arm64/boot/Image || { echo "::error::Image not found"; exit 1; }

      - name: Pack AnyKernel3
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp -f kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image
          sed -i "s/^kernel.string=.*/kernel.string=${{ inputs.kernel_name }}/" AnyKernel3/anykernel.sh || true

          DATE="$(date +%Y%m%d-%H%M)"
          ZIP_NAME="${{ inputs.kernel_name }}-${DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..

          mkdir -p artifacts
          mv -f "${ZIP_NAME}" artifacts/
          cp -f kernel_src/out/arch/arm64/boot/Image artifacts/Image
          cp -f kernel_src/out/.config artifacts/gki.config

      - name: Collect build logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          cp -f /tmp/kernel-build.log artifacts/logs/kernel-build.log || true
          cp -f /tmp/build-result.log artifacts/logs/build-result.log || true
          cp -f /tmp/ksu_susfs.config artifacts/logs/ksu_susfs.config || true
          cp -f kernel_src/out/.config artifacts/logs/final.config || true
          find kernel_src -type f \( -name "*.rej" -o -name "*.orig" \) -exec cp --parents {} artifacts/logs/ \; || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gki-ksu-susfs-anykernel
          path: artifacts/*
          if-no-files-found: warn
