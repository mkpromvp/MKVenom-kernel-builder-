name: "Spinel Kernel Builder - KSU + SUSFS (GKI)"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      root_manager:
        description: "Root manager (all include SUSFS)"
        required: true
        default: "KernelSU-Next"
        type: choice
        options:
          - "KernelSU-Next"
          - "SukiSU-Ultra"
          - "ReSukiSU"
          - "WildKernels-Patch"
      upload_gofile:
        description: "Upload outputs to GoFile"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git \
            libssl-dev libelf-dev lz4 python3 python-is-python3 \
            zip unzip cpio pahole pkg-config rsync \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            clang llvm lld llvm-dev libclang-dev jq
          echo "✓ Dependencies installed"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Clone kernel source
        run: |
          set -e
          echo "Cloning repository: ${{ inputs.kernel_source_url }}"
          echo "Branch: ${{ inputs.kernel_branch }}"
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source_url }}" kernel_src
          echo "KERNEL_DIR=$PWD/kernel_src" >> "$GITHUB_ENV"
          cd kernel_src
          VER=$(make kernelversion 2>/dev/null || echo "unknown")
          echo "KERNEL_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Kernel version: $VER"

      - name: Setup KSU + SUSFS (${{ inputs.root_manager }})
        run: |
          set -e
          cd "$KERNEL_DIR"

          setup_susfs() {
            echo "Adding SUSFS patches..."
            rm -rf ../susfs4ksu
            git clone --depth=1 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu || \
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

            cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
            cp ../susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/ 2>/dev/null || true

            for p in ../susfs4ksu/kernel_patches/*.patch; do
              if [ -f "$p" ]; then
                patch -p1 --forward < "$p" 2>/dev/null || true
              fi
            done
          }

          case "${{ inputs.root_manager }}" in
            "KernelSU-Next")
              curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              setup_susfs
              echo "MGR_REPO=KernelSU-Next/KernelSU-Next" >> "$GITHUB_ENV"
              echo "MGR_NAME=KernelSU-Next_Manager" >> "$GITHUB_ENV"
              ;;
            "SukiSU-Ultra")
              curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s susfs-main
              setup_susfs
              echo "MGR_REPO=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_ENV"
              echo "MGR_NAME=SukiSU_Manager" >> "$GITHUB_ENV"
              ;;
            "ReSukiSU")
              curl -fsSL "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
              setup_susfs
              echo "MGR_REPO=ReSukiSU/ReSukiSU" >> "$GITHUB_ENV"
              echo "MGR_NAME=ReSukiSU_Manager" >> "$GITHUB_ENV"
              ;;
            "WildKernels-Patch")
              curl -fsSL "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild-susfs/kernel/setup.sh" | bash -s wild-susfs
              setup_susfs
              echo "MGR_REPO=WildKernels/Wild_KSU" >> "$GITHUB_ENV"
              echo "MGR_NAME=WildKSU_Manager" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Add KSU + SUSFS config
        run: |
          set -e
          cd "$KERNEL_DIR"
          cat > arch/arm64/configs/ksu_susfs.config << 'KCFG'
          CONFIG_KSU=y
          CONFIG_KSU_DEBUG=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOFER=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          KCFG

          if [ -f build.config.gki.aarch64 ]; then
            if ! grep -q 'ksu_susfs.config' build.config.gki.aarch64; then
              echo 'POST_DEFCONFIG_CMDS="${POST_DEFCONFIG_CMDS} merge_config.sh -m .config arch/arm64/configs/ksu_susfs.config"' >> build.config.gki.aarch64
            fi
          fi

      - name: Build GKI Kernel
        run: |
          set -eo pipefail
          cd "$KERNEL_DIR"
          mkdir -p out dist

          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-

          echo "Cleaning source tree..."
          make ARCH=arm64 mrproper || true
          rm -f .config
          rm -rf out dist
          mkdir -p out dist

          if [ -f build/build.sh ]; then
            echo "Building with official GKI build script..."
            export BUILD_CONFIG=build.config.gki.aarch64
            export OUT_DIR=$PWD/out
            export DIST_DIR=$PWD/dist
            export SKIP_MRPROPER=1
            export BUILD_KERNEL=1
            bash build/build.sh 2>&1 | tee build.log
          else
            echo "Using fallback build..."
            make O=out ARCH=arm64 gki_defconfig
            
            echo "Applying KSU + SUSFS configs..."
            cat arch/arm64/configs/ksu_susfs.config >> out/.config
            make O=out ARCH=arm64 CC=clang LLVM=1 olddefconfig
            
            echo "Starting kernel compilation..."
            make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log
          fi

          echo "Searching for compiled kernel image..."
          IMAGE=$(find out dist -type f -name "Image" 2>/dev/null | head -n1 || true)
          if [ -z "$IMAGE" ]; then
            IMAGE=$(find out dist -type f -name "Image.gz" -o -name "Image.lz4" -o -name "Image.mac" 2>/dev/null | head -n1 || true)
          fi
          
          if [ -z "$IMAGE" ] || [ ! -f "$IMAGE" ]; then
            echo "❌ Error: Kernel Image not found! The build probably failed. Check build.log above."
            exit 1
          fi

          echo "IMAGE_PATH=$IMAGE" >> "$GITHUB_ENV"
          echo "✅ Kernel Image found at: $IMAGE"

      - name: Verify KSU + SUSFS
        run: |
          set -e
          IMAGE="${{ env.IMAGE_PATH }}"
          if [ -n "$IMAGE" ] && [ -f "$IMAGE" ]; then
            KSU="no"
            SUSFS="no"
            if strings "$IMAGE" | grep -Eiq 'kernelsu|KernelSU'; then KSU="yes"; fi
            if strings "$IMAGE" | grep -Eiq 'susfs|sus_su'; then SUSFS="yes"; fi
            echo "KSU_IN_KERNEL=$KSU" >> "$GITHUB_ENV"
            echo "SUSFS_IN_KERNEL=$SUSFS" >> "$GITHUB_ENV"
          fi

      - name: Setup magiskboot
        run: |
          set -e
          curl -fsSL "https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk" -o magisk.apk
          unzip -jq magisk.apk "lib/x86_64/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Build AnyKernel3
        run: |
          set -e
          mkdir -p out_artifacts
          if [ -n "${{ env.IMAGE_PATH }}" ] && [ -f "${{ env.IMAGE_PATH }}" ]; then
            cp "${{ env.IMAGE_PATH }}" out_artifacts/Image
            echo "Copied Image to out_artifacts successfully."
          else
            echo "❌ Cannot build AnyKernel3, kernel image is missing!"
            exit 1
          fi

          curl -fsSL "https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip" -o ak3.zip
          unzip -q ak3.zip
          cd AnyKernel3-master

          sed -i 's/^block=.*/block=boot/' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's/^do.modules=.*/do.modules=0/' anykernel.sh
          sed -i "s/^kernel.string=.*/kernel.string=Spinel GKI KSU+SUSFS [${{ inputs.root_manager }}]/" anykernel.sh

          zip -r9 ../out_artifacts/Flashable_AnyKernel3.zip . -x '.git/*'

      - name: Download Manager APK
        run: |
          set -e
          mkdir -p out_artifacts/managers
          if [ "${{ inputs.root_manager }}" = "ReSukiSU" ]; then
            curl -fsSL "https://nightly.link/ReSukiSU/ReSukiSU/workflows/build-manager/main/Manager-release.zip" -o /tmp/manager.zip
            unzip /tmp/manager.zip -d out_artifacts/managers/ || true
          else
            if [ -n "${{ env.MGR_REPO }}" ]; then
              URL=$(curl -fsSL "https://api.github.com/repos/${{ env.MGR_REPO }}/releases/latest" | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -1)
              if [ -n "$URL" ] && [ "$URL" != "null" ]; then
                curl -fsSL "$URL" -o "out_artifacts/managers/${{ env.MGR_NAME }}.apk" || true
              fi
            fi
          fi

      - name: Download SUSFS Module
        run: |
          set -e
          mkdir -p out_artifacts/modules
          curl -fsSL "https://github.com/sidex15/ksu_module_susfs/releases/latest/download/ksu_module_susfs.zip" -o out_artifacts/modules/ksu_module_susfs.zip || true

      - name: Generate build report
        run: |
          set -e
          mkdir -p out_artifacts
          cat > out_artifacts/build_report.txt << EOF
          Spinel Kernel Build Report
          ==========================
          Date           : $(date -u)
          Source         : ${{ inputs.kernel_source_url }}
          Branch         : ${{ inputs.kernel_branch }}
          Manager        : ${{ inputs.root_manager }}
          Kernel Version : ${{ env.KERNEL_VERSION }}
          KSU In Kernel  : ${{ env.KSU_IN_KERNEL }}
          SUSFS In Kernel : ${{ env.SUSFS_IN_KERNEL }}
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Spinel-GKI-${{ inputs.root_manager }}-${{ env.KERNEL_VERSION }}
          path: out_artifacts/
          retention-days: 7

      - name: Upload to GoFile
        if: ${{ inputs.upload_gofile }}
        run: |
          set -e
          upload_gofile() {
            FILE=$1
            LABEL=$2
            if [ -f "$FILE" ]; then
              SERVER=$(curl -fsSL https://api.gofile.io/servers | jq -r '.data.servers[0].name')
              if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
                LINK=$(curl -fsSL -F "file=@$FILE" "https://$SERVER.gofile.io/uploadFile" | jq -r '.data.downloadPage')
                echo "GoFile $LABEL: $LINK"
              fi
            fi
          }
          upload_gofile "out_artifacts/Flashable_AnyKernel3.zip" "ANYKERNEL3" 
