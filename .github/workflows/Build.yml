name: "Spinel GKI Builder - KSU + SUSFS + AnyKernel"

on:
  workflow_dispatch:
    inputs:
      kernel_source_url:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/MiCode/Xiaomi_Kernel_OpenSource"
        type: string
      kernel_branch:
        description: "Kernel source branch"
        required: true
        default: "spinel-v-oss"
        type: string
      kernel_name:
        description: "Kernel name"
        required: true
        default: "MKVenom-GKI-KSU-SUSFS_SPINEL"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Install deps
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison flex git curl build-essential \
            libssl-dev libelf-dev \
            clang llvm lld \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            lz4 python3 zip unzip cpio rsync pahole

      - name: Clone kernel source
        run: |
          set -e
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_source_url }}" kernel_src
          test -f kernel_src/arch/arm64/configs/gki_defconfig

      - name: Setup KernelSU-Next + SUSFS
        run: |
          set -e
          exec > >(tee /tmp/setup-susfs.log) 2>&1
          cd kernel_src
          export GIT_TERMINAL_PROMPT=0

          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash

          rm -rf ../susfs4ksu
          git clone --depth=1 --branch gki-android13-5.10 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu 2>/dev/null || \
          git clone --depth=1 --branch gki-android13-5.10 https://github.com/simonpunk/susfs4ksu.git ../susfs4ksu

          cp -f ../susfs4ksu/kernel_patches/fs/susfs.c fs/ || true
          cp -f ../susfs4ksu/kernel_patches/include/linux/* include/linux/ || true

          PATCHED=0
          for p in \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.10.patch \
            ../susfs4ksu/kernel_patches/50_add_susfs_in_*.patch \
            ../susfs4ksu/kernel_patches/add_susfs_in_kernel-*.patch
          do
            [ -f "$p" ] || continue
            if patch -p1 --forward --batch --dry-run < "$p" >/dev/null 2>&1; then
              patch -p1 --forward --batch < "$p"
              echo "Applied SUSFS patch: $(basename "$p")"
              PATCHED=1
              break
            fi
          done

          [ "$PATCHED" -eq 1 ] || { echo "::error::No SUSFS patch applied cleanly"; exit 1; }

      - name: Build GKI
        run: |
          set -e
          cd kernel_src

          SWAPFILE="/swapfile-${GITHUB_RUN_ID:-local}"
          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"
          if ! sudo fallocate -l 12G "$SWAPFILE"; then
            sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=12288 status=none
          fi
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          trap 'sudo swapoff "$SWAPFILE" 2>/dev/null || true; sudo rm -f "$SWAPFILE" 2>/dev/null || true' EXIT
          free -h

          MAKE_FLAGS="
            ARCH=arm64
            O=out
            CC=clang
            LLVM=1
            LLVM_IAS=1
            CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu-
          "

          make $MAKE_FLAGS mrproper
          mkdir -p out

          printf '%s\n' \
            'CONFIG_KSU=y' \
            'CONFIG_KSU_DEBUG=n' \
            'CONFIG_KSU_SUSFS=y' \
            'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_PATH=y' \
            'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
            'CONFIG_KSU_SUSFS_SUS_KSTAT=y' \
            'CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n' \
            'CONFIG_KSU_SUSFS_TRY_UMOUNT=y' \
            'CONFIG_KSU_SUSFS_SPOOFER=y' \
            'CONFIG_KSU_SUSFS_ENABLE_LOG=y' \
            'CONFIG_KSU_SUSFS_SUS_SU=n' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            > /tmp/ksu_susfs.config

          make $MAKE_FLAGS gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config /tmp/ksu_susfs.config
          make $MAKE_FLAGS olddefconfig

          ./scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_FULL -d LTO_CLANG_THIN || true
          ./scripts/config --file out/.config -d THINLTO || true
          ./scripts/config --file out/.config -d CFI_CLANG -d CFI_PERMISSIVE || true
          ./scripts/config --file out/.config -d SHADOW_CALL_STACK || true
          ./scripts/config --file out/.config -d DEBUG_INFO_BTF || true
          make $MAKE_FLAGS olddefconfig

          set +e
          make $MAKE_FLAGS -j2 2>&1 | tee /tmp/kernel-build.log
          BUILD_RC=${PIPESTATUS[0]}
          echo "BUILD_RC=$BUILD_RC" | tee /tmp/build-result.log
          set -e
          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"

      - name: Pack AnyKernel3 (spinel smart flash + real logs)
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp -f kernel_src/out/arch/arm64/boot/Image AnyKernel3/Image

          cat > AnyKernel3/anykernel.sh <<'AK3'
### AnyKernel3 - smart environment detection for spinel

properties() { '
kernel.string=__KERNEL_STRING__
do.devicecheck=1
do.modules=0
do.systemless=0
do.cleanup=1
do.cleanuponabort=0
device.name1=spinel
device.name2=
device.name3=
device.name4=
device.name5=
supported.versions=
supported.patchlevels=
supported.vendorpatchlevels=
'; } # end properties

BLOCK=auto;
IS_SLOT_DEVICE=auto;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

. tools/ak3-core.sh;

LOGFILE=/tmp/ak3_spinel_flash.log
: > "$LOGFILE"

logp() {
  ui_print "$1"
  echo "$1" >> "$LOGFILE"
}

flash_pair() {
  TARGET="$1"
  for SLOT in active inactive; do
    reset_ak keep
    BLOCK="$TARGET"
    IS_SLOT_DEVICE=auto
    SLOT_SELECT="$SLOT"
    logp "- Try target=$TARGET slot=$SLOT"

    if split_boot && flash_boot; then
      logp "  OK target=$TARGET slot=$SLOT"
    else
      logp "  FAIL target=$TARGET slot=$SLOT"
      return 1
    fi
  done
  return 0
}

logp "- Device: $(getprop ro.product.device 2>/dev/null)"
logp "- Slot suffix: $(getprop ro.boot.slot_suffix 2>/dev/null)"
logp "- Boot mode: $(getprop ro.bootmode 2>/dev/null)"

SUCCESS=0
USED_TARGET=""

for T in boot init_boot vendor_boot; do
  if flash_pair "$T"; then
    SUCCESS=1
    USED_TARGET="$T"
    break
  fi
done

if [ "$SUCCESS" -ne 1 ]; then
  logp "Aborting: no compatible target (boot/init_boot/vendor_boot) flashed."
  cp -f "$LOGFILE" /sdcard/Download/ak3_spinel_flash.log 2>/dev/null || true
  cp -f "$LOGFILE" /data/local/tmp/ak3_spinel_flash.log 2>/dev/null || true
  abort
fi

logp "- Flash completed using target=$USED_TARGET"
cp -f "$LOGFILE" /sdcard/Download/ak3_spinel_flash.log 2>/dev/null || true
cp -f "$LOGFILE" /data/local/tmp/ak3_spinel_flash.log 2>/dev/null || true
AK3

          sed -i "s|__KERNEL_STRING__|${{ inputs.kernel_name }}|g" AnyKernel3/anykernel.sh

          DATE="$(date +%Y%m%d-%H%M)"
          ZIP_NAME="${{ inputs.kernel_name }}-${DATE}.zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" . -x ".git/*" "README.md"
          cd ..

          mkdir -p artifacts artifacts/logs
          mv -f "${ZIP_NAME}" artifacts/
          cp -f kernel_src/out/arch/arm64/boot/Image artifacts/Image
          cp -f kernel_src/out/.config artifacts/gki.config
          cp -f AnyKernel3/anykernel.sh artifacts/logs/anykernel.final.sh


      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts/logs
          cp -f /tmp/setup-susfs.log artifacts/logs/setup-susfs.log || true
          cp -f /tmp/kernel-build.log artifacts/logs/kernel-build.log || true
          cp -f /tmp/build-result.log artifacts/logs/build-result.log || true
          cp -f /tmp/ksu_susfs.config artifacts/logs/ksu_susfs.config || true
          cp -f kernel_src/out/.config artifacts/logs/final.config || true

      - name: Upload AnyKernel zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anykernel-zip
          if-no-files-found: error
          path: artifacts/*.zip

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          if-no-files-found: warn
          path: artifacts/logs/**
